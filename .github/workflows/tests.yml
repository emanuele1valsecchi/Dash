name: Tests

# Runs on every push to a shared branch and on every pull request, so a broken
# commit is caught in minutes rather than at the next demo.
#
# Two independent jobs. They do not depend on each other on purpose: the
# Firestore rules are a different language, a different runner and a different
# failure mode from the Flutter suite, and a rules regression should not be
# hidden behind a Dart compile error (or the reverse).
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first — no point finishing a run
# for a commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version pubspec.yaml requires. Not `stable`: this
          # project has already lost a session to two SDKs disagreeing (see
          # TEST_NOTES.md section 1.1), and a floating channel would
          # reintroduce exactly that, remotely, where it is harder to debug.
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The mocks are committed, so this is a check rather than a build step:
      # it fails if someone edited `test/mocks.dart` without regenerating.
      #
      # Mostly a courtesy — a mock that is stale in a way that *matters* fails
      # compilation in the next step anyway. It catches the quieter case: an
      # entry removed from `@GenerateMocks` while the generated file keeps the
      # class, which still compiles.
      #
      # **Do not run this check locally on Windows.** `core.autocrlf=true`
      # rewrites line endings on checkout, so the diff is never empty there.
      # On the Linux runner the repo's LF endings and build_runner's output
      # match, so it is meaningful only here.
      - name: Verify generated mocks are up to date
        run: |
          dart run build_runner build
          if ! git diff --quiet -- test/mocks.mocks.dart; then
            echo "::error::test/mocks.mocks.dart is stale. Run: dart run build_runner build"
            git diff -- test/mocks.mocks.dart
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      # `tool/coverage.dart` rather than `flutter test --coverage`: the latter
      # only reports files a test imported, so its percentage is of the tested
      # subset and *rises* when you delete a test. The tool imports all of
      # `lib/` first so the denominator is the whole app. See TEST_NOTES.md.
      #
      # --min is a ratchet, not a target. Raise it as coverage climbs; never
      # lower it to make a red build green.
      - name: Test with coverage
        run: dart run tool/coverage.dart --min 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/report.html
          if-no-files-found: warn

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: test/rules/package-lock.json

      # The Firestore emulator is a Java process. 21 rather than 17 because
      # firebase-tools 15 requires it — the local pin to 14.19.0 exists only
      # because this project's dev machine has no JDK newer than 19.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: test/rules
        run: npm ci

      # Boots the emulator, runs `node --test` against the real
      # `firestore.rules` from the repo root, then shuts the emulator down.
      - name: Run rules tests
        working-directory: test/rules
        run: npm test
