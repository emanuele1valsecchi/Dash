name: dash
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  # Dart 3.12 / Flutter 3.44 is what pubspec.lock is resolved against
  # (cached_network_image 4.0.0 requires it). Pinned deliberately: with a
  # looser bound an older Flutter on PATH resolves far enough to fail
  # deep inside the framework ("Type 'ui.DisplayCornerRadii' not found")
  # instead of saying plainly that the SDK is too old.
  sdk: ^3.12.0
  flutter: '>=3.44.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter_tts: ^4.0.2
  flutter:
    sdk: flutter
  smooth_page_indicator: ^3.0.0
  google_fonts: ^8.2.1
  material_symbols_icons: ^4.2960.0
  url_launcher: ^6.2.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  # flutter_facebook_auth: ^7.1.1  # removed: unused, causes JVM target mismatch in Gradle
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  image_picker: ^1.1.2

  # Google Sign-In
  google_sign_in: ^7.2.0

  # Used by image_upload_service and profile_avatar_widget (photo upload, re-enable with Storage)
  # Held at 12.x deliberately: permission_handler_android 14.x (what 13.x
  # pulls) configures Kotlin's `kotlin { }` extension without ever applying
  # the Kotlin plugin, which fails under this project's AGP 9 +
  # android.builtInKotlin=false setup. 13.0.1 of the Android impl is pure
  # Java and has no such problem. Revisit together with the
  # package_info_plus override below once Flutter moves past 3.44.
  permission_handler: ^13.0.1
  mime: ^2.0.0

  # Map & location (OpenMap integration)
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  path_provider: ^2.1.5
  http: ^1.6.0
  cached_network_image: ^4.0.0
  # Already resolved transitively via cached_network_image; declared directly
  # since CachedTileProvider (map tile disk caching) now uses it as well.
  flutter_cache_manager: ^3.4.1
  table_calendar: ^3.2.0
  shared_preferences: ^2.5.5
  # Date/time formatting (notifications_page). Was reaching this transitively
  # via table_calendar, which analyze flags: a transitive dep can change or
  # vanish on any unrelated version bump, so it is declared directly.
  intl: any
  cloud_functions: ^6.3.6

  # Wire format shared with the Wear OS companion in wear/. By path, so the two
  # apps can never disagree about the shape of a message.
  dash_watch_protocol:
    path: packages/dash_watch_protocol
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  firebase_app_check: ^0.4.7
  pretty_qr_code: ^3.6.0
  share_plus: ^13.3.0
  mobile_scanner: ^7.4.0

  # Meta / Facebook
  #flutter_facebook_auth: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # End-to-end tests that drive the real app on a device/emulator
  # (integration_test/), as opposed to the widget tests under test/.
  integration_test:
    sdk: flutter

  # Mocking for anything reached through an injected collaborator.
  # mocks are generated into *.mocks.dart by build_runner:
  #   dart run build_runner build --delete-conflicting-outputs
  mockito: ^5.4.4
  build_runner: ^2.4.13

  # Provides `setupFirebaseCoreMocks()` so a widget test can call
  # `Firebase.initializeApp()` and screens that touch `FirebaseAuth.instance`
  # can be constructed. Reached transitively via firebase_core, but declared
  # directly because the tests import it (depend_on_referenced_packages).
  firebase_core_platform_interface: ^8.1.1

  # In-memory Firestore/Auth doubles, so repository and screen tests can run
  # without a live project or the emulator suite.
  fake_cloud_firestore: ^4.0.0
  firebase_auth_mocks: ^0.15.0

  # Widget tests that render a NetworkImage (profile pictures, badges) would
  # otherwise fail on the test binding's 400-response HTTP client.
  network_image_mock: ^2.1.1

  # Drives `Timer`/`Timer.periodic` on a virtual clock, so the run countdown
  # can be tested without five real seconds per case. Reached transitively via
  # flutter_test, declared directly because the tests import it.
  fake_async: ^1.3.1

  # Substitute the permission_handler platform channel in
  # location_service_test, so the real `LocationService` can be driven with
  # synthetic permission answers instead of a device. `permission_handler`
  # itself re-exports only `Permission`/`PermissionStatus`, not
  # `PermissionHandlerPlatform`, so the interface package is needed directly;
  # `plugin_platform_interface` supplies the `MockPlatformInterfaceMixin` that
  # lets a fake pass the interface's own token check. Both are reached
  # transitively, declared here because the tests import them
  # (depend_on_referenced_packages). Geolocator needs no equivalent entry —
  # `package:geolocator/geolocator.dart` does re-export `GeolocatorPlatform`.
  permission_handler_platform_interface: ^4.4.0
  plugin_platform_interface: ^2.1.8
  # Lets `firebase_auth_mocks`' MockUser be told to throw a specific
  # FirebaseAuthException — it already uses this internally, but the
  # `whenCalling` half is not re-exported, so tests need it directly.
  mock_exceptions: ^0.8.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

# Change the icon of the application
flutter_launcher_icons:
  image_path: "assets/images/IconPlain.png"
  android: true
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_foreground: "assets/images/IconPlain.png"
  adaptive_icon_background: "#173b3e"
  adaptive_icon_foreground_inset: 28
  ios: true
  remove_alpha_ios: true
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#173b3e"
  web:
    generate: true
    image_path: "assets/images/IconPlain.png"
    background_color: "#173b3e"
    theme_color: "#173b3e"
  windows:
    generate: true
    image_path: "assets/images/Icon2.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/Icon2.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/onboarding_1.png
    - assets/images/onboarding_2.png
    - assets/images/onboarding_3.png
    - assets/images/onboarding_4.png
    - assets/images/IconPlain.png
    - assets/images/Icon2.png
    - assets/images/Registered.png


  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ── Android build compatibility (AGP 9 + Kotlin) ─────────────────────────────
# This project runs AGP 9 with `android.builtInKotlin=false` (see
# android/gradle.properties), so every Android plugin module must apply the
# Kotlin plugin itself. package_info_plus 10.x does not: it skips applying it
# whenever AGP >= 9 — assuming that implies built-in Kotlin, without ever
# reading the flag — and then configures KotlinAndroidProjectExtension
# unconditionally, which fails the build with
# "Extension of type 'KotlinAndroidProjectExtension' does not exist".
# (firebase_core does the same check correctly, reading the property and
# guarding the configure with plugins.withId, which is why it builds fine.)
#
# We cannot instead switch built-in Kotlin on: google_sign_in_android 7.2.11
# still applies kotlin-android unconditionally and hard-fails under it, and
# the version that migrated (7.2.16) needs Flutter >= 3.44 while this project
# is on 3.41.9. Once the toolchain moves past 3.44, drop this override and
# set android.builtInKotlin=true instead.
#
# 9.x is safe here: package_info_plus reaches this project only through
# geolocator_linux (Linux-only desktop support), and nothing in the app
# imports it.